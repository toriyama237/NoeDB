[package]
name = "noedb-cli"
description = "Interactive NoeDB SQL shell and TCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "noedb"
path = "src/main.rs"

[dependencies]
noedb-engine = { workspace = true }
noedb-grpc = { workspace = true }
noedb-protocol = { workspace = true }
noedb-raft = { workspace = true }
noedb-tls = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

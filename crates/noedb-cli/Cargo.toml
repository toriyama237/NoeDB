[package]
name = "noedb-cli"
description = "Interactive NoeDB SQL shell and TCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "noedb"
path = "src/main.rs"

[dependencies]
noedb-engine = { workspace = true }
noedb-metrics = { workspace = true }
noedb-grpc = { workspace = true }
noedb-protocol = { workspace = true }
noedb-raft = { workspace = true }
noedb-tls = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
otel = [
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
optional = true

[dependencies.tracing-opentelemetry]
version = "0.29"
optional = true

[dependencies.opentelemetry]
version = "0.28"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.28"
features = ["rt-tokio"]
optional = true

[dependencies.opentelemetry-otlp]
version = "0.28"
features = ["grpc-tonic"]
optional = true

[lints]
workspace = true

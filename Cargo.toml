[package]
name = "noedb"
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
description = "A distributed embedded SQL query engine in Rust - think SQLite meets CockroachDB."
license = "MIT OR Apache-2.0"
repository = "https://github.com/toriyama237/NoeDB"
homepage = "https://github.com/toriyama237/NoeDB"
documentation = "https://docs.rs/noedb"
readme = "README.md"
keywords = ["database", "sql", "distributed", "raft", "lsm-tree"]
categories = ["database-implementations"]
authors = ["Rykiel KAMENI YAMDJEU"]
exclude = [
    ".github/",
    "docs/",
    "assets/",
    "benches/",
    "tests/",
    ".gitignore",
    ".editorconfig",
    "deny.toml",
    "cliff.toml",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
]

[lib]
name = "noedb"
path = "src/lib.rs"

[features]
default = []
# Reserved for upcoming phases. Kept empty today so that
# `cargo build --all-features` stays meaningful from day 1.
unstable = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }

[[bench]]
name = "lexer"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.ci]
inherits = "dev"
incremental = false
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic noise we explicitly accept:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
multiple_crate_versions = "allow"

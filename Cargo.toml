# NoeDB - Cargo workspace.
#
# The crate layout mirrors the data flow of a SQL query:
#
#   noedb-lexer  -> noedb-parser -> noedb-ast
#                                |
#                                v
#                       noedb-planner -> noedb-raft -> noedb-storage
#
# The meta-crate `noedb` re-exports the user-facing API and is the
# only crate published on crates.io (today).
#
# Each crate inherits package metadata, MSRV, license, and lints from
# this root via `package.workspace = true` and `[lints] workspace = true`.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toriyama237/NoeDB"
homepage = "https://github.com/toriyama237/NoeDB"
authors = ["Rykiel KAMENI YAMDJEU"]
categories = ["database-implementations"]
keywords = ["database", "sql", "distributed", "raft", "lsm-tree"]

[workspace.dependencies]
# Internal crates - pinned via path so the workspace builds with a
# single `cargo build --workspace`. Versions are kept in sync with
# the workspace `version` above.
noedb         = { path = "crates/noedb",          version = "=1.0.1" }
noedb-lexer   = { path = "crates/noedb-lexer",    version = "=1.0.1" }
noedb-ast     = { path = "crates/noedb-ast",      version = "=1.0.1" }
noedb-parser  = { path = "crates/noedb-parser",   version = "=1.0.1" }
noedb-planner = { path = "crates/noedb-planner",  version = "=1.0.1" }
noedb-storage = { path = "crates/noedb-storage",  version = "=1.0.1" }
noedb-raft    = { path = "crates/noedb-raft",     version = "=1.0.1" }
noedb-engine  = { path = "crates/noedb-engine",   version = "=1.0.1" }
noedb-protocol = { path = "crates/noedb-protocol", version = "=1.0.1" }
noedb-tls     = { path = "crates/noedb-tls",      version = "=1.0.1" }
noedb-grpc    = { path = "crates/noedb-grpc",     version = "=1.0.1" }
noedb-txn     = { path = "crates/noedb-txn",      version = "=1.0.1" }

tonic = { version = "0.13", default-features = false, features = ["transport", "codegen", "tls-ring", "prost", "router", "server"] }
prost = "0.13"
tonic-build = "0.13"
hex = "0.4"
serde_json = "1.0"
protoc-bin-vendored = "3"

# Phase 4 Raft + networking
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
tokio-rustls = "0.26"

tokio = { version = "1.43", features = ["sync", "time", "rt-multi-thread", "macros", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytes = "1.10"
thiserror = "2.0"
crc32fast = "1.4"
tracing = "0.1"
rand = "0.8"
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
parking_lot = "0.12"
rayon = "1.10"
lz4_flex = "0.11"
lru = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic noise we explicitly accept:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.ci]
inherits = "dev"
incremental = false
debug = "line-tables-only"

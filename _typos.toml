# Configuration for `typos` (https://github.com/crate-ci/typos).
# Picked up by the CI workflow.

[files]
extend-exclude = [
    "target/",
    "CHANGELOG.md",
    "*.lock",
    "docs/**",
    "scripts/**",
]

[default]
extend-ignore-re = [
    "[0-9a-f]{7,40}",
]

[default.extend-words]
# Project-specific spellings.
crate = "crate"
Noe = "Noe"
NoeDB = "NoeDB"
noe = "noe"
noedb = "noedb"
arbo = "arbo"
hashmap = "hashmap"
tokeniser = "tokeniser"
tokenise = "tokenise"
decorrelate = "decorrelate"
decorrelated = "decorrelated"
decorrelation = "decorrelation"

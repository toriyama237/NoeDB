[package]
name = "noedb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
noedb-lexer = { path = "../crates/noedb-lexer" }
noedb-parser = { path = "../crates/noedb-parser" }
noedb-protocol = { path = "../crates/noedb-protocol" }
noedb-raft = { path = "../crates/noedb-raft" }
noedb-storage = { path = "../crates/noedb-storage" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sql_parser"
path = "fuzz_targets/sql_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_wire"
path = "fuzz_targets/protocol_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mvcc_codec"
path = "fuzz_targets/mvcc_codec.rs"
test = false
doc = false
bench = false

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions-all:
        patterns:
          - "*"
        # dtolnay/rust-toolchain uses Rust *compiler* versions as tags
        # (e.g. @1.78.0). Dependabot misreads this as a regular semver
        # action tag and tries to bump it to nonexistent versions
        # (e.g. @1.100.0). MSRV bumps must be deliberate, so we manage
        # this action by hand.
        exclude-patterns:
          - "dtolnay/rust-toolchain"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    labels:
      - "dependencies"
      - "github-actions"
